<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HatchMatch, revision round 1 — review sheet</title>
<style>
  body{margin:0;background:#EDE9E2;color:#2B2B2B;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  main{padding:28px 20px 60px}
  h1{font-size:18px;margin:0 0 2px}
  p.sub{color:#6B6B6B;margin:0 0 24px}
  .grid{display:flex;flex-direction:column;gap:22px;align-items:flex-start}
  figure{margin:0}
  figcaption{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8A8377;margin:0 0 8px}
  .stage{padding:20px;border-radius:14px;display:inline-block}
  .stage.dark{background:#F4F1EC}
  .stage.light{background:#fff;border:1px solid #E3DED4}
</style>
</head>
<body>
<main>
  <h1>HatchMatch widget — revision round 1</h1>
  <p class="sub">Tickets 1, 2 and 3. Cards are live: flow and weather are real. Add <code>?shot=0</code>&hellip;<code>10</code> for one at a time.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
  // Each figure mounts its own card, then is driven into the state it is meant to show.
  // Card width is what matters, not viewport: the demo host page pads 20px each side,
  // so a 390px phone gives a 350px card. 440px is the card's own max-width.
  // Card width is what matters, not viewport: the demo host page pads 20px each side,
  // so a 390px phone gives a 350px card. 440px is the card's own max-width.
  const A = ['morning','midday','afternoon','anytime'];
  const SHOTS = [
    ['Compact · dark · 350px card (390px phone)', 'dark',  {open:false}, 350],
    ['Compact · light · 350px card',              'light', {open:false}, 350],
    ['NOW · dark',                                'dark',  {open:true, tab:'now'}, 350],
    ['HATCH · dark · now-slot open on load',      'dark',  {open:true, tab:'hatch'}, 350],
    ['HATCH · dark · every slot open',            'dark',  {open:true, tab:'hatch', expanded:new Set(A)}, 350],
    ['HATCH · light · every slot open',           'light', {open:true, tab:'hatch', expanded:new Set(A)}, 350],
    ['TRIP · dark',                               'dark',  {open:true, tab:'trip'}, 350],
    ['TRIP · light',                              'light', {open:true, tab:'trip'}, 350],
    ['TRIP · dark · 2 anglers, 2 days',           'dark',  {open:true, tab:'trip', anglers:2, days:2}, 350],
    ['HATCH · dark · 440px',                      'dark',  {open:true, tab:'hatch', expanded:new Set(A)}, 440],
    ['NOTES · dark',                              'dark',  {open:true, tab:'notes'}, 350],
  ];
  // ?shot=N renders a single figure, so a screenshot never has to scroll.
  const only = new URLSearchParams(location.search).get('shot');
  const grid = document.getElementById('grid');
  SHOTS.forEach(([label, theme, state, w], i) => {
    if (only !== null && String(i) !== only) return;
    const fig = document.createElement('figure');
    fig.innerHTML = `<figcaption>${label}</figcaption><div class="stage ${theme}"><div class="hatchmatch" style="width:${w}px" data-theme="${theme}" data-accent="orange" data-shot="${i}"></div></div>`;
    grid.appendChild(fig);
  });
  addEventListener('load', () => setTimeout(() => {
    SHOTS.forEach(([, , state], i) => {
      if (only !== null && String(i) !== only) return;
      const host = document.querySelector(`[data-shot="${i}"]`);
      const card = window.HatchMatch.cards.find(c => c.host === host);
      if (card) card.set(state);
    });
  }, 1200));
</script>
<script src="../dist/embed.js"></script>
</body>
</html>
